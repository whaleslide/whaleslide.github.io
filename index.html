*{

}

body{
    background:

/* 顶部导航 */

header{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:1100px;

    padding:18px 30px;

    background:rgba(255,255,255,.65);
    backdrop-filter:blur(20px);

    border-radius:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 10px 40px rgba(0,0,0,.08);
}


.logo{
    font-size:22px;
    font-weight:600;
}


nav a{
    margin-left:30px;
    text-decoration:none;
    color:#555;
}

nav a:hover{
    color:#000;
}



/* 首页 */

.hero{

    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

}


.hero h1{

    font-size:72px;

    letter-spacing:-3px;

    margin-bottom:25px;

}


.hero p{

    font-size:22px;

    color:#666;

    margin-bottom:50px;

}


.buttons a{

    display:inline-block;

    padding:15px 35px;

    border-radius:40px;

    text-decoration:none;

    margin:10px;

    font-size:18px;

}


.download{

    background:#111;

    color:white;

}


.more{

    border:1px solid #ddd;

    color:#333;

}



/* 产品 */

.section{

    max-width:1100px;

    margin:auto;

    padding:100px 30px;

}


.section h2{

    font-size:45px;

    margin-bottom:30px;

}


.card{

    padding:40px;

    border-radius:30px;

    background:rgba(255,255,255,.7);

    box-shadow:0 20px 60px rgba(0,0,0,.08);

}


.card p{

    font-size:20px;

    line-height:1.8;

    color:#555;

}



/* 底部 */

footer{

    text-align:center;

    padding:50px;

    color:#888;

}


</style>

</head>
